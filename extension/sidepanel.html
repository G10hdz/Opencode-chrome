<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>opencode-chrome</title>
    <style>
      * { box-sizing: border-box; }
      body { font: 13px system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
      #ctx { padding: 0.4rem 0.75rem; font-size: 12px; color: #555; border-bottom: 1px solid #e0e0e0; }
      #ctx b { color: #222; }
      #log { flex: 1; overflow-y: auto; padding: 0.5rem 0.75rem; }
      .msg { margin: 0 0 0.5rem; white-space: pre-wrap; word-wrap: break-word; }
      .user { background: #e8f0fe; border-radius: 8px; padding: 0.4rem 0.6rem; }
      .tool { color: #666; font-size: 12px; font-family: ui-monospace, monospace; }
      .tool.error { color: #b71c1c; }
      .tool.denied { color: #9a6700; }
      .error { color: #b71c1c; }
      .confirm { border: 1px solid #d0d0d0; border-radius: 8px; padding: 0.5rem; background: #fffbe6; }
      .confirm p { margin: 0 0 0.4rem; }
      .confirm code { font-size: 12px; word-break: break-all; }
      .confirm button { margin-right: 0.4rem; }
      #bar { display: flex; gap: 0.4rem; padding: 0.5rem 0.75rem; border-top: 1px solid #e0e0e0; }
      #input { flex: 1; border: 1px solid #d0d0d0; border-radius: 8px; padding: 0.45rem 0.6rem; font: inherit; resize: none; }
      button { font: inherit; border: 1px solid #d0d0d0; border-radius: 8px; background: #fff; padding: 0.45rem 0.8rem; cursor: pointer; }
      button:hover { background: #f2f2f2; }
      button:disabled { opacity: 0.5; cursor: default; }
      .muted { color: #888; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="ctx">attach a tab with the extension icon to start</div>
    <div id="log"></div>
    <div id="bar">
      <textarea id="input" rows="2" placeholder="Tell it what to do…"></textarea>
      <button id="send">Send</button>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
